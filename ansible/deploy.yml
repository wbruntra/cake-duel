---
# Deploy cake-duel: ansible-playbook ansible/deploy.yml -e deployment=production
# Deploys origin/<target_branch> from GitHub, so push first.
- name: Deploy cake-duel
  hosts: '{{ deployment | mandatory("Pass -e deployment=<profile>, e.g. -e deployment=production") }}'
  vars:
    node_bin_dir: '/home/{{ ansible_user }}/.nvm/versions/node/{{ pm2_node_version }}/bin'
    secrets_bundle: '{{ playbook_dir }}/files/{{ deployment }}/secrets.js'

  tasks:
    - name: 1. Update repository
      git:
        repo: 'git@github.com:wbruntra/cake-duel.git'
        dest: '{{ project_root }}'
        version: '{{ branch | default(target_branch) }}'
        force: yes
      register: git_result
      tags: [git]

    - name: 2. Copy secrets.js from the local secrets bundle, if present
      # The server's secrets.js is the source of truth until
      # files/<profile>/secrets.js exists locally; without it this step
      # leaves the server's file alone.
      copy:
        src: '{{ secrets_bundle }}'
        dest: '{{ project_root }}/secrets.js'
        mode: '0600'
      when: lookup('ansible.builtin.fileglob', secrets_bundle) | length > 0
      tags: [secrets]

    - name: 3. Install dependencies (server and frontend)
      command: bun install --frozen-lockfile
      args:
        chdir: '{{ item }}'
      loop:
        - '{{ project_root }}'
        - '{{ project_root }}/frontend'
      tags: [deps]

    - name: 4. Back up and migrate the database
      block:
        - name: Ensure backup directory exists
          file:
            path: '{{ project_root }}/backups'
            state: directory
            mode: '0700'

        - name: Back up the SQLite database
          # .backup is WAL-safe, unlike copying the file.
          command: >-
            sqlite3 {{ db_file }}
            ".backup backups/{{ db_file }}.{{ (git_result.before or 'initial')[:7] }}.{{ ansible_date_time.iso8601_basic_short }}"
          args:
            chdir: '{{ project_root }}'
            removes: '{{ project_root }}/{{ db_file }}'

        - name: Keep only the 10 newest backups
          shell: ls -1t {{ db_file }}.* | tail -n +11 | xargs -r rm --
          args:
            chdir: '{{ project_root }}/backups'
          changed_when: false
          when: not ansible_check_mode

        - name: Apply drizzle migrations
          # bun:sqlite migrator; drizzle-kit can't connect through bun:sqlite.
          command: bun run db:apply
          args:
            chdir: '{{ project_root }}'
          register: migrate_result
          changed_when: "'applied: 0 new' not in migrate_result.stdout"
      tags: [migrate, db]

    - name: 5. Build frontend
      command: bun run build
      args:
        chdir: '{{ project_root }}'
      tags: [build, frontend]

    - name: 6. Restart the app (pm2)
      environment:
        # pm2 lives under nvm, which a non-interactive shell doesn't put on PATH.
        PATH: '{{ node_bin_dir }}:{{ ansible_env.PATH }}'
      block:
        - name: Recreate the pm2 process if its entry script changed
          shell: |
            want="{{ project_root }}/$(bun -e "console.log(require('./ecosystem.config.cjs').apps[0].script)")"
            have=$(pm2 jlist | bun -e "const l = await Bun.stdin.json(); console.log(l.find((a) => a.name === '{{ pm2_name }}')?.pm2_env.pm_exec_path ?? '')")
            if [ -n "$have" ] && [ "$have" != "$want" ]; then
              pm2 delete {{ pm2_name }} && echo "recreated: $have -> $want"
            fi
          args:
            chdir: '{{ project_root }}'
          register: pm2_recreate
          changed_when: "'recreated' in pm2_recreate.stdout"

        - name: Start or restart from ecosystem.config.cjs
          command: pm2 startOrRestart ecosystem.config.cjs --update-env
          args:
            chdir: '{{ project_root }}'

        - name: Persist the pm2 process list
          command: pm2 save
      tags: [pm2, restart]

    - name: 7. Verify the app answers on its port
      uri:
        url: 'http://127.0.0.1:{{ app_port }}/api/health'
        timeout: 10
      register: local_check
      failed_when: (local_check.json.status | default('')) != 'ok'
      retries: 6
      delay: 5
      until: local_check is succeeded
      changed_when: false
      tags: [verify]

    - name: 8. Verify the public site through nginx
      delegate_to: localhost
      block:
        - name: Frontend loads
          uri:
            url: '{{ public_url }}/'
            return_content: yes
          register: public_page
          failed_when: '''<div id="root">'' not in public_page.content'
          changed_when: false

        - name: API answers
          uri:
            url: '{{ public_url }}/api/health'
          register: public_api
          retries: 3
          delay: 5
          until: public_api is succeeded
          changed_when: false
      tags: [verify]

    - name: Deployed
      debug:
        msg: '{{ deployment }} is at {{ git_result.after[:7] }} (was {{ git_result.before[:7] if git_result.before else "none" }})'
      tags: [git]
