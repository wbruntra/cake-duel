<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <!-- Warm parchment background -->
  <rect width="100" height="140" fill="#F5E6C8" rx="8"/>
  <!-- Thick outer border -->
  <rect x="5" y="5" width="90" height="130" rx="6" fill="none" stroke="#B8860B" stroke-width="4"/>
  <!-- Inner dashed border -->
  <rect x="13" y="13" width="74" height="114" rx="4" fill="none" stroke="#D4A574" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Center medallion -->
  <circle cx="50" cy="70" r="24" fill="#E8C88A" stroke="#B8860B" stroke-width="3"/>
  <!-- Inner circle -->
  <circle cx="50" cy="70" r="15" fill="none" stroke="#D4A574" stroke-width="2"/>
  <!-- Simple cake slice -->
  <path d="M42 74 L50 62 L58 74 Z" fill="#FFD700" stroke="#B8860B" stroke-width="2" stroke-linejoin="round"/>
  <rect x="44" y="74" width="12" height="4" rx="1" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
  <!-- Corner circles -->
  <circle cx="18" cy="22" r="4" fill="#D4A574"/>
  <circle cx="82" cy="22" r="4" fill="#D4A574"/>
  <circle cx="18" cy="118" r="4" fill="#D4A574"/>
  <circle cx="82" cy="118" r="4" fill="#D4A574"/>
</svg>
