<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#2EBFBF"/>
  <!-- ground shadow -->
  <ellipse cx="50" cy="90" rx="22" ry="4.5" fill="#1a1a2e" opacity="0.3"/>
  <!-- legs -->
  <rect x="36" y="78" width="8" height="12" rx="4" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <rect x="56" y="78" width="8" height="12" rx="4" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <!-- macaron body: two tan circles + ruffled foot -->
  <!-- bottom macaron half -->
  <circle cx="50" cy="68" r="14" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <!-- ruffled foot (wider ellipse between halves) -->
  <ellipse cx="50" cy="64" rx="16" ry="5" fill="#FFF0D4" stroke="#D4A574" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- top macaron half -->
  <circle cx="50" cy="58" r="14" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <!-- right arm (holding beaker) -->
  <rect x="64" y="56" width="14" height="7" rx="3" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <!-- lab coat sleeve patch -->
  <rect x="67" y="55" width="9" height="9" rx="2" fill="white" stroke="#CCC" stroke-width="1"/>
  <!-- neck -->
  <rect x="45" y="42" width="10" height="5" rx="2" fill="#F5DEB3"/>
  <!-- lab coat collar (white V-shape) -->
  <path d="M38 47 L50 56 L62 47" fill="white" stroke="#CCC" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="50" cy="36" r="12" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <!-- goggles (two overlapping circles + bridge) -->
  <circle cx="44" cy="34" r="6" fill="none" stroke="#5A8A9A" stroke-width="2"/>
  <circle cx="56" cy="34" r="6" fill="none" stroke="#5A8A9A" stroke-width="2"/>
  <!-- goggle bridge -->
  <line x1="49" y1="34" x2="51" y2="34" stroke="#5A8A9A" stroke-width="2"/>
  <!-- goggle lens tint -->
  <circle cx="44" cy="34" r="4.5" fill="#88CCDD" opacity="0.4"/>
  <circle cx="56" cy="34" r="4.5" fill="#88CCDD" opacity="0.4"/>
  <!-- eyes visible through goggles -->
  <circle cx="44" cy="34" r="1.5" fill="#2C1810"/>
  <circle cx="56" cy="34" r="1.5" fill="#2C1810"/>
  <!-- blush -->
  <ellipse cx="38" cy="38" rx="2.5" ry="2" fill="#FFB0B0" opacity="0.4"/>
  <ellipse cx="62" cy="38" rx="2.5" ry="2" fill="#FFB0B0" opacity="0.4"/>
  <!-- small smile -->
  <path d="M46 40 Q50 43 54 40" fill="none" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>
  <!-- beaker -->
  <path d="M77 48 L80 48 L82 65 Q83 70 79 70 L77 70 Q73 70 74 65 L76 48 Z" fill="#AADDFF" fill-opacity="0.5" stroke="#5A8A9A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- beaker liquid -->
  <path d="M75 54 L81 54 L82 65 Q83 70 79 70 L77 70 Q73 70 74 65 Z" fill="#44DD88" opacity="0.7"/>
  <!-- bubbles rising from beaker -->
  <circle cx="78" cy="48" r="2.5" fill="none" stroke="#88DDAA" stroke-width="1"/>
  <circle cx="80" cy="44" r="1.8" fill="none" stroke="#88DDAA" stroke-width="1"/>
  <circle cx="77" cy="41" r="1.2" fill="none" stroke="#88DDAA" stroke-width="1"/>
  <!-- left arm (stub) -->
  <rect x="26" y="58" width="10" height="7" rx="3" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <!-- lab coat sleeve patch -->
  <rect x="27" y="57" width="9" height="9" rx="2" fill="white" stroke="#CCC" stroke-width="1"/>
</svg>
