<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#2A3570"/>
  <!-- ground shadow -->
  <ellipse cx="50" cy="90" rx="24" ry="4.5" fill="#1a1a2e" opacity="0.3"/>
  <!-- legs -->
  <rect x="35" y="78" width="8" height="12" rx="4" fill="#A8A0B8" stroke="#7A7290" stroke-width="2"/>
  <rect x="57" y="78" width="8" height="12" rx="4" fill="#A8A0B8" stroke="#7A7290" stroke-width="2"/>
  <!-- tattered cape (behind body) -->
  <path d="M25 30 L75 30 L78 52 L72 55 L68 48 L62 54 L58 47 L52 56 L46 48 L40 55 L34 47 L28 52 Z" fill="#8B1A1A" stroke="#5C0E0E" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- cape bottom jagged edge (overlay dark) -->
  <path d="M25 30 L77 30 L79 48 L27 48 Z" fill="#8B1A1A" stroke="none"/>
  <!-- body (wolf, rounder/cakier, muted lavender-gray) -->
  <circle cx="50" cy="64" r="17" fill="#A8A0B8" stroke="#7A7290" stroke-width="2"/>
  <!-- neck ruff -->
  <ellipse cx="50" cy="48" rx="16" ry="6" fill="#C0B8D0" stroke="#7A7290" stroke-width="2"/>
  <!-- head -->
  <circle cx="50" cy="38" r="14" fill="#A8A0B8" stroke="#7A7290" stroke-width="2"/>
  <!-- triangular ears -->
  <polygon points="38,28 34,18 44,24" fill="#A8A0B8" stroke="#7A7290" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="62,28 66,18 56,24" fill="#A8A0B8" stroke="#7A7290" stroke-width="2" stroke-linejoin="round"/>
  <!-- inner ears -->
  <polygon points="39,27 36,20 43,25" fill="#D0C0D8"/>
  <polygon points="61,27 64,20 57,25" fill="#D0C0D8"/>
  <!-- snout -->
  <ellipse cx="50" cy="44" rx="10" ry="7" fill="#D0C0D8" stroke="#7A7290" stroke-width="2"/>
  <!-- nose -->
  <ellipse cx="50" cy="41" rx="3" ry="2" fill="#2C1810"/>
  <!-- open howling mouth -->
  <ellipse cx="50" cy="47" rx="5" ry="3.5" fill="#2C1810"/>
  <!-- teeth (small white zigzag) -->
  <rect x="47" y="45" width="2" height="2.5" fill="white" rx="0.5"/>
  <rect x="51" y="45" width="2" height="2.5" fill="white" rx="0.5"/>
  <rect x="49" y="48" width="2" height="2" fill="white" rx="0.5"/>
  <!-- mischievous wide eyes -->
  <circle cx="44" cy="36" r="3" fill="white"/>
  <circle cx="56" cy="36" r="3" fill="white"/>
  <circle cx="44" cy="36" r="1.8" fill="#2C1810"/>
  <circle cx="56" cy="36" r="1.8" fill="#2C1810"/>
  <circle cx="44.7" cy="35.2" r="0.7" fill="white"/>
  <circle cx="56.7" cy="35.2" r="0.7" fill="white"/>
  <!-- blush -->
  <ellipse cx="38" cy="39" rx="2.5" ry="2" fill="#FFB0B0" opacity="0.4"/>
  <ellipse cx="62" cy="39" rx="2.5" ry="2" fill="#FFB0B0" opacity="0.4"/>
  <!-- left arm (raised triumphantly) -->
  <rect x="22" y="46" width="10" height="7" rx="3" fill="#A8A0B8" stroke="#7A7290" stroke-width="2" transform="rotate(-60, 22, 46)"/>
  <!-- right arm holding cake slice -->
  <rect x="62" y="56" width="14" height="7" rx="3" fill="#A8A0B8" stroke="#7A7290" stroke-width="2" transform="rotate(-20, 62, 56)"/>
  <!-- cake slice -->
  <path d="M75 52 L85 52 L80 65 Z" fill="#FFD700" stroke="#B8860B" stroke-width="2" stroke-linejoin="round"/>
  <!-- cake layers -->
  <line x1="77" y1="55" x2="83" y2="55" stroke="#FFF8DC" stroke-width="1.5"/>
  <line x1="78" y1="58" x2="82" y2="58" stroke="#FF69B4" stroke-width="1.5"/>
  <!-- candle -->
  <line x1="80" y1="42" x2="80" y2="52" stroke="#DDDDDD" stroke-width="2" stroke-linecap="round"/>
  <!-- flame -->
  <ellipse cx="80" cy="40" rx="3" ry="4" fill="#FF8C00"/>
  <ellipse cx="80" cy="39" rx="1.5" ry="2" fill="#FFD700"/>
</svg>
