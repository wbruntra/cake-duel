<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#F0A030"/>
  <!-- ground shadow -->
  <ellipse cx="50" cy="90" rx="22" ry="4.5" fill="#1a1a2e" opacity="0.3"/>
  <!-- legs -->
  <rect x="37" y="78" width="8" height="12" rx="4" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <rect x="55" y="78" width="8" height="12" rx="4" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <!-- body (shortbread cookie) -->
  <circle cx="50" cy="65" r="17" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <!-- cookie texture dots -->
  <circle cx="43" cy="61" r="2" fill="#A0722A"/>
  <circle cx="55" cy="65" r="1.8" fill="#A0722A"/>
  <circle cx="47" cy="72" r="1.5" fill="#A0722A"/>
  <!-- left arm (stub out) -->
  <rect x="30" y="59" width="10" height="7" rx="3" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <!-- neck -->
  <rect x="45" y="48" width="10" height="6" rx="2" fill="#F5DEB3"/>
  <!-- head -->
  <circle cx="50" cy="41" r="14" fill="#F5DEB3" stroke="#C4956A" stroke-width="2"/>
  <!-- helmet dome -->
  <path d="M34 41 A16 16 0 0 1 66 41 L64 34 Q50 28 36 34 Z" fill="#8A9BA8" stroke="#5A6A78" stroke-width="2"/>
  <!-- visor bar -->
  <rect x="36" y="40" width="28" height="3" rx="1.5" fill="#5A6A78"/>
  <!-- face -->
  <circle cx="44" cy="42" r="2" fill="#2C1810"/>
  <circle cx="56" cy="42" r="2" fill="#2C1810"/>
  <circle cx="44.6" cy="41.3" r="0.8" fill="white"/>
  <circle cx="56.6" cy="41.3" r="0.8" fill="white"/>
  <ellipse cx="38" cy="46" rx="2.5" ry="2" fill="#FFB0B0" opacity="0.4"/>
  <ellipse cx="62" cy="46" rx="2.5" ry="2" fill="#FFB0B0" opacity="0.4"/>
  <path d="M45 48 Q50 51 55 48" fill="none" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>
  <!-- right arm (angled up) -->
  <rect x="60" y="55" width="14" height="7" rx="3" fill="#F5DEB3" stroke="#C4956A" stroke-width="2" transform="rotate(-35, 60, 55)"/>
  <!-- sword -->
  <rect x="73" y="20" width="4" height="32" rx="1.5" fill="#D4D4D4" stroke="#999" stroke-width="1.5"/>
  <rect x="66" y="50" width="18" height="3.5" rx="1.5" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
  <rect x="73" y="53" width="4" height="10" rx="1.5" fill="#8B4513" stroke="#5C2D0E" stroke-width="1.5"/>
</svg>
