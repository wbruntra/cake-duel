<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#9070CC"/>
  <!-- ground shadow -->
  <ellipse cx="50" cy="90" rx="22" ry="4.5" fill="#1a1a2e" opacity="0.3"/>
  <!-- legs -->
  <rect x="37" y="78" width="8" height="12" rx="4" fill="#FFF0D4" stroke="#D4A574" stroke-width="2"/>
  <rect x="55" y="78" width="8" height="12" rx="4" fill="#FFF0D4" stroke="#D4A574" stroke-width="2"/>
  <!-- body (cream puff) -->
  <circle cx="50" cy="65" r="17" fill="#FFF0D4" stroke="#D4A574" stroke-width="2"/>
  <!-- puff bump on top -->
  <circle cx="50" cy="48" r="6" fill="#FFF0D4" stroke="#D4A574" stroke-width="2"/>
  <!-- left arm -->
  <rect x="28" y="60" width="10" height="7" rx="3" fill="#FFF0D4" stroke="#D4A574" stroke-width="2"/>
  <!-- neck -->
  <rect x="45" y="40" width="10" height="5" rx="2" fill="#FFF0D4"/>
  <!-- head -->
  <circle cx="50" cy="35" r="12" fill="#FFF0D4" stroke="#D4A574" stroke-width="2"/>
  <!-- wizard hat (tall triangle - dominant shape) -->
  <path d="M33 33 L50 5 L67 33 Z" fill="#5B3A8C" stroke="#3D1F6E" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- hat stars -->
  <circle cx="44" cy="20" r="2.5" fill="#FFD700" opacity="0.9"/>
  <circle cx="56" cy="16" r="1.8" fill="#FFD700" opacity="0.9"/>
  <circle cx="50" cy="26" r="1.5" fill="#FFD700" opacity="0.7"/>
  <!-- hat brim -->
  <ellipse cx="50" cy="33" rx="18" ry="3" fill="#5B3A8C" stroke="#3D1F6E" stroke-width="2"/>
  <!-- face -->
  <!-- half-closed/dreamy eyes -->
  <path d="M41 33 Q43 31 45 33" fill="none" stroke="#2C1810" stroke-width="2" stroke-linecap="round"/>
  <path d="M55 33 Q57 31 59 33" fill="none" stroke="#2C1810" stroke-width="2" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="39" cy="37" rx="2.5" ry="2" fill="#FFB0B0" opacity="0.4"/>
  <ellipse cx="61" cy="37" rx="2.5" ry="2" fill="#FFB0B0" opacity="0.4"/>
  <!-- open-mouth smile -->
  <ellipse cx="50" cy="39" rx="3" ry="2" fill="#2C1810"/>
  <!-- right arm raised holding wand -->
  <rect x="63" y="50" width="14" height="7" rx="3" fill="#FFF0D4" stroke="#D4A574" stroke-width="2" transform="rotate(-50, 63, 50)"/>
  <!-- wand -->
  <rect x="73" y="24" width="3" height="24" rx="1.5" fill="#8B6914" stroke="#6B4E0A" stroke-width="1"/>
  <!-- wand tip glow -->
  <circle cx="74.5" cy="23" r="4" fill="#FFD700" opacity="0.7"/>
  <circle cx="74.5" cy="23" r="2" fill="#FFF8DC"/>
  <!-- sparkles radiating -->
  <line x1="74.5" y1="16" x2="74.5" y2="13" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="79.5" y1="20" x2="82" y2="18" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="69.5" y1="20" x2="67" y2="18" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="25" x2="80" y2="27" stroke="#FFD700" stroke-width="1" stroke-linecap="round"/>
  <line x1="71" y1="25" x2="69" y2="27" stroke="#FFD700" stroke-width="1" stroke-linecap="round"/>
  <!-- extra sparkle dots -->
  <circle cx="80" cy="16" r="1" fill="#FFD700"/>
  <circle cx="68" cy="16" r="1" fill="#FFD700"/>
  <circle cx="76" cy="28" r="0.8" fill="#FFD700"/>
  <circle cx="72" cy="29" r="0.6" fill="#FFD700"/>
</svg>
